services:
  mysql:
    image: mysql:8.0
    container_name: web
    ports:
      - '3306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: web
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d
      - ./my.cnf:/etc/mysql/conf.d/my.cnf
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost -ppasword || exit 1']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - web_ai
volumes:
  mysql_data:
networks:
  web_ai:
    name: web_ai
