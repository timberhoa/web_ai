services:
  mysql:
    image: mysql:8.0
    container_name: mysql_db
    ports:
      - '3307:3306'
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: db_1
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost -password || exit 1']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - web_ai
volumes:
  mysql_data:
networks:
  web_ai:
    name: web_ai